<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirShare - Secure Gesture Lens</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- MediaPipe Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="glow-orb" id="orb-1"></div>
    <div class="glow-orb" id="orb-2"></div>

    <!-- Phone Simulator Frame -->
    <div class="phone-screen">
        <!-- Phone Status Bar -->
        <div class="phone-header">
            <span class="time">12:45</span>
            <div class="icons">📶 🔋 98%</div>
        </div>

        <div class="phone-body">
            
            <!-- Connection Setup Mode (Radar Scanner) -->
            <div class="setup-container" id="setup-panel">
                <div class="logo">
                    <span class="pulse-dot"></span>
                    <h1>AirShare</h1>
                </div>
                <p class="subtitle">Secure Network Link</p>
                <div class="discovery-radar-section" style="margin: 15px 0; background: transparent; border: none;">
                    <div class="radar-container" style="height: 120px;">
                        <div class="radar-circle" style="border-color: #3b82f6; width: 44px; height: 44px;"></div>
                        <div class="radar-circle delay-1" style="border-color: #3b82f6; width: 44px; height: 44px;"></div>
                        <div class="radar-circle delay-2" style="border-color: #3b82f6; width: 44px; height: 44px;"></div>
                        <div class="device-hub" style="background: radial-gradient(circle, #3b82f6 0%, #1e3a8a 100%);">
                            <span class="hub-icon">📡</span>
                        </div>
                    </div>
                    <div id="scan-status" style="font-size: 0.8rem; color: #9ca3af; margin-top: 10px; font-weight: 500;">
                        Scanning local Wi-Fi...
                    </div>
                </div>

                <!-- Discovered targets list -->
                <div id="peers-container" style="text-align: left; margin-bottom: 15px;">
                    <span style="font-size: 0.75rem; color: #9ca3af; font-weight: bold; text-transform: uppercase;">Discovered Devices:</span>
                    <div id="peers-list" style="margin-top: 8px; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Dynamically filled: Windows PC #123 (Pair) -->
                    </div>
                </div>

                <div class="system-status">
                    <span>Daemon:</span> <strong style="color: #10b981;">AUTO-SCANNING</strong>
                </div>
            </div>

            <!-- Mode: Gallery Grid (Shows after connection) -->
            <div class="gallery-view" id="gallery-panel" style="display: none;">
                <div class="gallery-header">
                    <h3>My Gallery</h3>
                    <span class="connection-status" id="ws-status">ONLINE</span>
                </div>
                <div class="photos-grid">
                    <div class="photo-item active" onclick="selectPhoto(this)">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80" alt="Art 1">
                    </div>
                    <div class="photo-item" onclick="selectPhoto(this)">
                        <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400&q=80" alt="Art 2">
                    </div>
                    <div class="photo-item" onclick="selectPhoto(this)">
                        <img src="https://images.unsplash.com/photo-1604871000636-074fa5117945?w=400&q=80" alt="Art 3">
                    </div>
                    <div class="photo-item" onclick="selectPhoto(this)">
                        <img src="https://images.unsplash.com/photo-1617791160505-6f006e121980?w=400&q=80" alt="Art 4">
                    </div>
                </div>
                <div class="active-photo-preview">
                    <div class="main-preview-frame">
                        <img id="active-photo" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80" alt="Active Preview">
                    </div>
                </div>

                <!-- Received View Inbox -->
                <div class="received-overlay" id="received-view">
                    <div class="received-banner">Received Inbox</div>
                    <div class="received-photo-wrapper" id="received-photo-frame">
                        <div class="empty-inbox">
                            <span class="empty-icon">✋</span>
                            <p>Release hand to drop image here.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Floating Action Bubble -->
        <div class="floating-bubble" id="airshare-bubble" style="display: none;" onclick="toggleGestureCamera()">
            <span class="bubble-icon">✊</span>
            <span class="ping-ring"></span>
        </div>

        <!-- Floating Camera Card -->
        <div class="floating-camera-card" id="camera-overlay">
            <div class="widget-header">
                <span>AirShare Lens</span>
                <div class="widget-badge" id="gesture-badge">Idle</div>
            </div>
            <div class="widget-video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output-canvas"></canvas>
                
                <div class="widget-hud">
                    <span id="hud-status">Scanning gesture...</span>
                </div>
            </div>
        </div>

        <!-- Home Indicator Bar -->
        <div class="phone-home-bar"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">Action Triggered!</div>

    <script src="script.js"></script>
</body>
</html>
